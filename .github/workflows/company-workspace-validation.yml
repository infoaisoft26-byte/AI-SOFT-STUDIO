name: Company workspace validation

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "company.html"
      - "company.css"
      - "company.js"
      - "companies.html"
      - "company-admin.js"
      - "vite.config.js"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check company.js
          node --check company-admin.js
      - name: Build frontend
        run: npm run build
